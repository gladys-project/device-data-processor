openapi: 3.1.2
info:
  title: Gladys Kafka device data output
  version: 1.0.0
  description: Device-data projection for downstream device services; no sensor measurements
    or business decisions.
paths: {}
components:
  schemas:
    DeviceError:
      $ref: kafka-raw-telemetry.yml#/components/schemas/DeviceError
    KafkaDeviceData:
      type: object
      additionalProperties: false
      description: Device diagnostics and original observation metadata projected
        from raw telemetry. Sensor measurements are intentionally excluded; deviceId
        remains the intended Kafka key.
      required:
      - schemaVersion
      - eventId
      - eventType
      - deviceId
      - bootId
      - sequence
      - uptimeMs
      - observedAt
      - clockSource
      - mock
      - errors
      properties:
        schemaVersion:
          type: integer
          const: 1
        eventId:
          type: string
          format: uuid
          description: Identity of this observation; preserved across transport retries.
        eventType:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: Original observation event type, preserved without interpretation.
        deviceId:
          type: string
          format: uuid
          description: Device identity and intended Kafka key.
        bootId:
          type: string
          format: uuid
          description: Identity of the device boot session.
        sequence:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Nonnegative sequence within a boot session.
        uptimeMs:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Device uptime in milliseconds at observation.
        observedAt:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Observation time as Unix epoch milliseconds, not an RFC 3339
            string.
        clockSource:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: Clock provenance, for example MANUAL_TEST. No closed vocabulary
            is established yet.
        mock:
          type: boolean
        batteryLevelPct:
          type: integer
          minimum: 0
          maximum: 100
          description: Battery charge percentage when available. Omit for a device without a battery charge reading.
          x-jackson-json-include-policy: NON_NULL
        supplyVoltageMv:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: Estimated device-board supply rail voltage in millivolts when measured.
          x-jackson-json-include-policy: NON_NULL
        errors:
          type: array
          description: Complete active diagnostic snapshot for this device. An empty array reports no active conditions. Identify conditions by component and code.
          items:
            $ref: '#/components/schemas/DeviceError'
